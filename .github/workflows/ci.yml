name: Validate feeds

# On valide TOUS les push sur main, y compris les commits de publication.
#
# Ces commits étaient auparavant exclus par nécessité : feed.py écrivait ses 14
# fichiers en 14 commits séparés, et la CI levée sur un commit intermédiaire
# voyait un état incohérent (status.json à jour mais pas encore feed-*.json).
# Depuis la publication atomique, un run produit un commit unique et cohérent —
# le valider a donc du sens, et fait détecter une publication malformée en
# quelques minutes au lieu d'attendre le prochain cron de monitor.yml.
# Coût : deux exécutions supplémentaires par jour, de quelques secondes.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0

      - name: Validate feeds format & freshness
        run: python3 tools/validate_feeds.py

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      # pymisp n'est volontairement pas installé : les tests couvrent le chemin
      # dégradé (PYMISP_AVAILABLE=False) et simulent la bibliothèque quand ils
      # ont besoin d'exercer la connexion. Cela garde le job rapide.
      - name: Install test dependencies
        run: pip install --no-cache-dir pytest requests

      - name: Run tests
        run: python -m pytest
