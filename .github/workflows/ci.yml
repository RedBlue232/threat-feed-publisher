name: Validate feeds

# On ne déclenche QUE sur les changements de code, jamais sur les commits de
# publication automatique de feed.py / misp_export.py. Raison : feed.py pousse
# 14 fichiers via 14 commits API séparés, et la CI levée sur un commit
# intermédiaire voit un état transitoire incohérent (par ex status.json mis à
# jour mais pas encore feed-*.json). La fraîcheur des données est validée par
# monitor.yml (cron 13h) qui tombe hors cycle de publication.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'feeds/**'
      - 'state/**'
      - 'misp-feed/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0

      - name: Validate feeds format & freshness
        run: python3 tools/validate_feeds.py

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      # pymisp n'est volontairement pas installé : les tests couvrent le chemin
      # dégradé (PYMISP_AVAILABLE=False) et simulent la bibliothèque quand ils
      # ont besoin d'exercer la connexion. Cela garde le job rapide.
      - name: Install test dependencies
        run: pip install --no-cache-dir pytest requests

      - name: Run tests
        run: python -m pytest
